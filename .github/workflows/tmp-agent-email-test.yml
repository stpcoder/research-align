name: Temporary agent email test

on:
  push:
    branches:
      - tmp-agent-email-test-20260816

permissions:
  contents: read

jobs:
  send-email:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Provision ClawMail inbox and send test email
        shell: bash
        run: |
          set -euo pipefail

          NAME="chatgpt-agent-${GITHUB_RUN_ID}"
          REGISTER_PAYLOAD=$(jq -nc --arg name "$NAME" --arg owner "thbrian@naver.com" '{name:$name, owner_email:$owner}')

          REGISTER_BODY=$(mktemp)
          REGISTER_STATUS=$(curl -sS -o "$REGISTER_BODY" -w '%{http_code}' \
            -X POST 'https://api.clawmail.me/v1/register' \
            -H 'Content-Type: application/json' \
            --data "$REGISTER_PAYLOAD")

          if [[ "$REGISTER_STATUS" != "201" && "$REGISTER_STATUS" != "200" ]]; then
            echo "ClawMail register failed: HTTP $REGISTER_STATUS"
            cat "$REGISTER_BODY"
            exit 1
          fi

          EMAIL=$(jq -r '.email // empty' "$REGISTER_BODY")
          API_KEY=$(jq -r '.api_key // empty' "$REGISTER_BODY")
          INBOX_ID=$(jq -r '.inbox_id // empty' "$REGISTER_BODY")

          if [[ -z "$EMAIL" || -z "$API_KEY" || -z "$INBOX_ID" ]]; then
            echo "Register response did not contain expected fields."
            jq 'del(.api_key)' "$REGISTER_BODY"
            exit 1
          fi

          echo "Provisioned sender: $EMAIL"
          echo "Inbox ID: $INBOX_ID"

          SEND_PAYLOAD=$(jq -nc \
            --arg to 'thbrian@naver.com' \
            --arg subject 'ChatGPT agent email test — no Gmail' \
            --arg text "This is an automated delivery test initiated by ChatGPT on 2026-08-16. The sender address was provisioned directly through ClawMail.me's agent email API. Gmail was not used. Sender: $EMAIL" \
            '{to:$to, subject:$subject, text:$text}')

          SEND_BODY=$(mktemp)
          SEND_STATUS=$(curl -sS -o "$SEND_BODY" -w '%{http_code}' \
            -X POST "https://api.clawmail.me/v1/inboxes/${INBOX_ID}/messages" \
            -H "Authorization: Bearer ${API_KEY}" \
            -H 'Content-Type: application/json' \
            --data "$SEND_PAYLOAD")

          echo "Send API HTTP status: $SEND_STATUS"
          jq . "$SEND_BODY" || cat "$SEND_BODY"

          if [[ "$SEND_STATUS" != "202" && "$SEND_STATUS" != "200" && "$SEND_STATUS" != "201" ]]; then
            exit 1
          fi

          sleep 5
          LIST_BODY=$(mktemp)
          LIST_STATUS=$(curl -sS -o "$LIST_BODY" -w '%{http_code}' \
            -X GET "https://api.clawmail.me/v1/inboxes/${INBOX_ID}/messages" \
            -H "Authorization: Bearer ${API_KEY}")

          echo "Message-list HTTP status: $LIST_STATUS"
          if [[ "$LIST_STATUS" == "200" ]]; then
            jq 'if type=="array" then map({id:(.id // .message_id), direction, status, to, subject, sent_at, created_at}) else . end' "$LIST_BODY" || true
          else
            cat "$LIST_BODY"
          fi

          {
            echo "## Agent email test"
            echo "- Provider: ClawMail.me"
            echo "- Sender: $EMAIL"
            echo "- Recipient: thbrian@naver.com"
            echo "- Send API status: HTTP $SEND_STATUS"
            echo "- Gmail used: no"
          } >> "$GITHUB_STEP_SUMMARY"
