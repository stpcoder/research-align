name: Vercel Control Plane (manual fallback)

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Manifest name without .json (for example: research-align)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: vercel-control-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DEPLOY_CONTROL_SECRETS: ${{ secrets.DEPLOY_CONTROL_SECRETS }}
      GITHUB_ADMIN_TOKEN: ${{ secrets.GITHUB_ADMIN_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve manifest
        shell: bash
        env:
          INPUT_PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail
          manifest="deploy-control/projects/${INPUT_PROJECT}.json"
          test -f "$manifest" || { echo "Manifest not found: $manifest"; exit 1; }
          echo "$manifest" > /tmp/manifests.txt

      - name: Check Vercel credential
        shell: bash
        run: |
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo 'This workflow is only a manual fallback. Primary ChatGPT deployments use the server-side Supabase control plane.' >&2
            echo 'If you want to use this fallback, add repository secret VERCEL_TOKEN.' >&2
            exit 1
          fi

      - name: Apply manifest
        shell: bash
        run: node deploy-control/scripts/apply.mjs "$(cat /tmp/manifests.txt)"

      - name: Commit deployment state
        shell: bash
        run: |
          set -euo pipefail
          [[ -d deploy-control/state ]] || exit 0
          git config user.name 'research-align-deploy-bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add deploy-control/state/
          git diff --cached --quiet && exit 0
          git commit -m 'Update Vercel deployment state'
          git push
